
data:
  chunks: data/chunks.json
  benchmark: data/benchmark.json

retriever:
  type: vector
  embedding:
    type: huggingface
    model_name: BAAI/bge-m3

  index:
    type: chroma
    location: local
    path: artifacts/indexes/cendara-bge-m3
    options:
      collection_name: cendara_bge_m3

retrieval_policy:
  top_k: 5

evaluation:
  judge:
    type: llm
    model:
      provider: gigachat
      name: GigaChat-2
    prompt: default_relevance
    max_attempts: 3

  metrics:
    - type: recall_at_k
      k: 1
    - type: recall_at_k
      k: 5
    - type: reciprocal_rank
